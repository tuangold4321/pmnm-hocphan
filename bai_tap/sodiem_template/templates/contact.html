{% extends "hello.html" %}

{% block title %}Liên hệ - MiniBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h2 class="mb-3">Liên Hệ Với Chúng Tôi</h2>
        <p class="text-muted mb-4">Nếu bạn có thắc mắc hoặc góp ý, vui lòng gửi tin nhắn cho chúng tôi theo biểu mẫu dưới đây.</p>

        <!-- Display-only Form (Non-functional) -->
        <form onsubmit="return false;">
            <div class="mb-3">
                <label for="name" class="form-label font-weight-bold">Họ và tên</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên...">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label font-weight-bold">Địa chỉ Email</label>
                <input type="email" class="form-control" id="email" placeholder="example@domain.com">
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label font-weight-bold">Chủ đề</label>
                <input type="text" class="form-control" id="subject" placeholder="Tiêu đề tin nhắn...">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label font-weight-bold">Nội dung tin nhắn</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung cần gửi..."></textarea>
            </div>

            <button type="button" class="btn btn-primary w-100">Gửi liên hệ ngay</button>
        </form>
    </div>
</div>
{% endblock %}
