{% extends 'layout.html' %}
{% block content %}

<form action="{{ url_for('books') }}" method="GET" class="row g-2 mb-4 align-items-center">
    <div class="col-md-7">
        <input type="text" name="q" class="form-control" placeholder="Tìm tên sách, tác giả..." value="{{ request.args.get('q', '') }}">
    </div>
    <div class="col-md-3">
        <select name="category_id" class="form-select">
            <option value="">Mọi danh mục</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if current_cat == cat.id|string %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Lọc</button>
    </div>
</form>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for book in books %}
    <div class="col">
        <div class="card h-100 shadow-sm border-light">
            <a href="{{ url_for('book_detail', id=book.id) }}">
                {% if book.image %}
                <img src="{{ url_for('static', filename='uploads/' + book.image) }}" class="card-img-top p-2" alt="{{ book.title }}" style="height: 160px; object-fit: contain;">
                {% else %}
                <div class="card-img-placeholder d-flex align-items-center justify-content-center m-2 rounded">
                </div>
                {% endif %}
            </a>
            
            <div class="card-body d-flex flex-column p-3">
                <h6 class="card-title fw-bold text-dark text-truncate mb-2">
                    <a href="{{ url_for('book_detail', id=book.id) }}" class="text-decoration-none text-dark">{{ book.title }}</a>
                </h6>
                
                <!-- Giá và Tồn kho -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold text-orange">{{ "{:,.0f}".format(book.price).replace(',', '.') }} đ</span>
                    <span class="text-muted small">Còn {{ book.stock }}</span>
                </div>
                
                <div class="mt-auto">
                    <form action="{{ url_for('add_to_cart', book_id=book.id) }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <!-- Mặc định thêm 1 cuốn -->
                        <input type="hidden" name="quantity" value="1">
                        
                        {% if book.stock > 0 %}
                            <button type="submit" class="btn btn-primary w-100 text-white rounded-2">
                                + Thêm vào giỏ
                            </button>
                        {% else %}
                            <button type="button" class="btn btn-light w-100 text-muted rounded-2 border" disabled>
                                Hết hàng
                            </button>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
