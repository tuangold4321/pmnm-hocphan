<!-- templates/_navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" style="background-color: #0f3c6c;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('books') }}">
            <i class="fas fa-book-open me-2"></i>Nhà sách Sông Hương
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-4">
                    <a class="nav-link text-white" href="{{ url_for('books') }}">Sách</a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for('cart') }}" class="nav-link text-white position-relative">
                        <i class="fas fa-shopping-cart me-1"></i> Giỏ hàng
                        {% if cart_count and cart_count > 0 %}
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill mt-2 ms-n2" style="background-color: #ea580c; color: white;">
                            {{ cart_count }}
                        </span>
                        {% endif %}
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
