<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand me-auto" href="{{ url_for('home') }}">Hệ thống tính toán</a>

        <div class="navbar-nav d-flex flex-row align-items-center gap-3">
            {% block nav %}
            <a class="nav-link {{ 'active' if request.endpoint == 'home' }}"
               href="{{ url_for('home') }}">Trang chủ</a>

            <a class="nav-link {{ 'active' if request.endpoint == 'tinh_toan' }}"
               href="{{ url_for('tinh_toan') }}">Trang tính toán</a>

            {% if session.get('user') %}
            <a class="nav-link {{ 'active' if request.endpoint == 'profile' }}"
               href="{{ url_for('profile') }}">Hồ sơ</a>
            <span class="navbar-text">Xin chào <strong>{{ session.get('user') }}</strong>!</span>
            <form method="POST" action="{{ url_for('logout') }}" class="d-flex align-items-center mb-0">
                <button type="submit" class="btn btn-danger btn-sm">Đăng xuất</button>
            </form>
            {% else %}
            <a class="nav-link {{ 'active' if request.endpoint == 'login' }}"
               href="{{ url_for('login') }}">Đăng nhập</a>
            <a class="nav-link {{ 'active' if request.endpoint == 'register' }}"
               href="{{ url_for('register') }}">Đăng ký</a>
            {% endif %}
            {% endblock %}
        </div>
    </div>
</nav>
