{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block breadcrumb %}<a class="link-secondary text-decoration-none" href="{{ url_for('books') }}">Sách</a> <span class="mx-1">/</span> {{ page_title }}{% endblock %}
{% block content %}
<div class="mb-4">
  <h1 class="h2 mb-1">{{ page_title }}</h1>
  <p class="text-secondary mb-0">Thông tin sách được quản lý theo danh mục.</p>
</div>
<section class="card border-0 shadow-sm" style="max-width: 900px;">
  <form method="post" class="card-body p-4">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label" for="title">Tên sách <span class="text-danger">*</span></label>
        <input class="form-control" id="title" name="title" type="text" maxlength="200" required autofocus value="{{ book.title or '' }}" placeholder="Nhập tên sách">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="author">Tác giả <span class="text-danger">*</span></label>
        <input class="form-control" id="author" name="author" type="text" maxlength="150" required value="{{ book.author or '' }}" placeholder="Tên tác giả">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="category_id">Danh mục <span class="text-danger">*</span></label>
        <select class="form-select" id="category_id" name="category_id" required>
          <option value="">Chọn danh mục</option>
          {% for category in categories %}<option value="{{ category.id }}" {% if book.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="isbn">ISBN</label>
        <input class="form-control" id="isbn" name="isbn" type="text" maxlength="30" value="{{ book.isbn or '' }}" placeholder="Ví dụ: 978-604-...">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="publisher">Nhà xuất bản</label>
        <input class="form-control" id="publisher" name="publisher" type="text" maxlength="150" value="{{ book.publisher or '' }}" placeholder="Tên nhà xuất bản">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="published_year">Năm xuất bản</label>
        <input class="form-control" id="published_year" name="published_year" type="number" min="1000" max="9999" value="{{ book.published_year_text or '' }}" placeholder="Ví dụ: 2024">
      </div>
      <div class="col-12">
        <label class="form-label" for="description">Mô tả</label>
        <textarea class="form-control" id="description" name="description" maxlength="2000" rows="4" placeholder="Mô tả nội dung sách">{{ book.description or '' }}</textarea>
      </div>
    </div>
    <div class="d-flex justify-content-end gap-2 border-top mt-4 pt-3">
      <a class="btn btn-outline-secondary" href="{{ url_for('books') }}">Hủy</a>
      <button class="btn btn-primary" type="submit">Lưu thông tin sách</button>
    </div>
  </form>
</section>
{% endblock %}
