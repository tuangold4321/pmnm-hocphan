<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý sách{% endblock %} · Thư viện</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  {% include "_navbar.html" %}
  <main class="container py-4 py-lg-5">
    {% if notification or errors %}
      <div class="mb-4">
        {% if notification %}
          <div class="alert alert-{{ 'danger' if notification[0] == 'error' else notification[0] }} mb-2" role="alert">{{ notification[1] }}</div>
        {% endif %}
        {% for error in errors|default([]) %}
          <div class="alert alert-danger mb-2" role="alert">{{ error }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
