{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-dark text-white">Thêm Danh Mục</div>
            <div class="card-body">
                <form method="POST" action="/categories">
                    <div class="mb-3">
                        <label class="form-label">Tên danh mục</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Thêm</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Danh Mục</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td>{{ cat.id }}</td>
                    <td>
                        <form method="POST" action="/categories/edit/{{ cat.id }}" class="d-flex">
                            <input type="text" name="name" value="{{ cat.name }}" class="form-control form-control-sm me-2" required>
                            <button type="submit" class="btn btn-sm btn-warning">Lưu</button>
                        </form>
                    </td>
                    <td>
                        <a href="/categories/delete/{{ cat.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa danh mục này sẽ xóa toàn bộ sách bên trong. Tiếp tục?');">Xóa</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
