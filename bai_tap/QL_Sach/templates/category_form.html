{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block breadcrumb %}<a class="link-secondary text-decoration-none" href="{{ url_for('categories') }}">Danh mục sách</a> <span class="mx-1">/</span> {{ page_title }}{% endblock %}
{% block content %}
<div class="mb-4">
  <h1 class="h2 mb-1">{{ page_title }}</h1>
  <p class="text-secondary mb-0">Điền thông tin danh mục sách.</p>
</div>
<section class="card border-0 shadow-sm" style="max-width: 760px;">
  <form method="post" class="card-body p-4">
    <div class="mb-3">
      <label class="form-label" for="name">Tên danh mục <span class="text-danger">*</span></label>
      <input class="form-control" id="name" name="name" type="text" maxlength="100" required autofocus value="{{ category.name or '' }}" placeholder="Ví dụ: Văn học">
    </div>
    <div class="mb-4">
      <label class="form-label" for="description">Mô tả</label>
      <textarea class="form-control" id="description" name="description" maxlength="1000" rows="4" placeholder="Mô tả ngắn về danh mục này">{{ category.description or '' }}</textarea>
      <div class="form-text">Tối đa 1000 ký tự.</div>
    </div>
    <div class="d-flex justify-content-end gap-2 border-top pt-3">
      <a class="btn btn-outline-secondary" href="{{ url_for('categories') }}">Hủy</a>
      <button class="btn btn-primary" type="submit">Lưu danh mục</button>
    </div>
  </form>
</section>
{% endblock %}
