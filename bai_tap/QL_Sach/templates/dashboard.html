{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Tổng quan hệ thống</h2>
<div class="row">
    <div class="col-md-6">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body">
                <h5 class="card-title">Tổng số Danh mục</h5>
                <h2 class="card-text">{{ total_categories }}</h2>
                <a href="/categories" class="text-white text-decoration-none">Quản lý danh mục →</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">Tổng số Sách</h5>
                <h2 class="card-text">{{ total_books }}</h2>
                <a href="/books" class="text-white text-decoration-none">Quản lý sách →</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
