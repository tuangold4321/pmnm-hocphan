{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-dark text-white">Thêm Sách</div>
            <div class="card-body">
                <form method="POST" action="/books">
                    <div class="mb-3">
                        <label class="form-label">Tên sách</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tác giả</label>
                        <input type="text" name="author" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Danh mục</label>
                        <select name="category_id" class="form-select" required>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Thêm Sách</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Sách</th>
                    <th>Tác giả</th>
                    <th>Danh mục</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <form method="POST" action="/books/edit/{{ book.id }}">
                        <td>{{ book.id }}</td>
                        <td><input type="text" name="title" value="{{ book.title }}" class="form-control form-control-sm" required></td>
                        <td><input type="text" name="author" value="{{ book.author }}" class="form-control form-control-sm" required></td>
                        <td>
                            <select name="category_id" class="form-select form-select-sm" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}" {% if cat.id == book.category_id %}selected{% endif %}>{{ cat.name }}</option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <div class="btn-group">
                                <button type="submit" class="btn btn-sm btn-warning">Lưu</button>
                                <a href="/books/delete/{{ book.id }}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa sách này?');">Xóa</a>
                            </div>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
