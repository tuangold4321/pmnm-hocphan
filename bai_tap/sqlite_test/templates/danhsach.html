<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách sinh viên</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <section class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 mb-4">Danh sách sinh viên</h1>

                {% if students %}
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>MSSV</th>
                                <th>Họ tên</th>
                                <th>GPA</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for student in students %}
                            <tr>
                                <td>{{ student.id }}</td>
                                <td>{{ student.mssv }}</td>
                                <td>{{ student.name }}</td>
                                <td>{{ "%.2f"|format(student.gpa) }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="mb-0">Chưa có sinh viên nào trong cơ sở dữ liệu.</p>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
